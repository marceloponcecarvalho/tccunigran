<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
</head>

<body>

    <header>
        <h1>Manutenção de Piscinas - Cadastro de Clientes</h1>
    </header>

    <main>
        <form id="formCliente" action="/clientes/salvar" method="POST">

            <h3>Dados do Cliente</h3>

            <input type="hidden" name="idCliente" id="idCliente">

            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label>CPF/CNPJ:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="18" required>
                <button type="button" onclick="buscarCliente()">Consultar</button>
            </div>

            <div class="campo">
                <label>Endereço:</label>
                <input type="text" name="endereco">
            </div>

            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </div>


            <h3>Dimensões da piscina</h3>

            <label>Profundidade:</label>
            <input type="number" name="profundidade" step="0.01" min="0.01" required>

            <label>Tamanho do lado 1:</label>
            <input type="number" name="lado1" step="0.01" min="0.01" required>

            <label>Tamanho do lado 2:</label>
            <input type="number" name="lado2" step="0.01" min="0.01" required>

            <div class="botoes">
                <button type="button" class="voltar" onclick="window.location.href='index.html'">
                    Voltar
                </button>
                <button type="submit">Salvar</button>
            </div>

        </form>

        <h2>Clientes cadastrados</h2>

        <table border="1" cellpadding="8" cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Endereço</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="listaClientes">
            </tbody>
        </table>




    </main>
    <script>
        async function buscarCliente() {
            const cpf = document.getElementById("cpf").value.trim();

            if (!cpf) {
                alert("Informe o CPF/CNPJ.");
                return;
            }

            try {
                const resposta = await fetch(
                    "/clientes/buscar?cpf=" + encodeURIComponent(cpf)
                );

                const cliente = await resposta.json();

                if (cliente.erro) {
                    alert(cliente.erro);
                    return;
                }

                if (!cliente) {
                    document.getElementById("idCliente").value = "";

                    document.querySelector("[name=nome]").value = "";
                    document.querySelector("[name=endereco]").value = "";
                    document.querySelector("[name=telefone]").value = "";
                    document.querySelector("[name=email]").value = "";
                    document.querySelector("[name=profundidade]").value = "";
                    document.querySelector("[name=lado1]").value = "";
                    document.querySelector("[name=lado2]").value = "";

                    alert("Cliente não encontrado. Preencha os dados para cadastrá-lo.");
                    return;
                }

                document.getElementById("idCliente").value = cliente.idCliente;

                document.querySelector("[name=nome]").value = cliente.nome;
                document.querySelector("[name=cpf]").value = cliente.cpf;
                document.querySelector("[name=endereco]").value = cliente.endereco;
                document.querySelector("[name=telefone]").value = cliente.telefone;
                document.querySelector("[name=email]").value = cliente.email;

                document.querySelector("[name=profundidade]").value =
                    cliente.profundidade ?? "";

                document.querySelector("[name=lado1]").value =
                    cliente.lado1 ?? "";

                document.querySelector("[name=lado2]").value =
                    cliente.lado2 ?? "";

                alert("Cliente encontrado! Código: " + cliente.idCliente);

            } catch (erro) {
                alert("Erro ao consultar cliente.");
                console.error(erro);
            }
        }
        async function carregarClientes() {
            try {
                const resposta = await fetch("/clientes/listar");

                if (!resposta.ok) {
                    throw new Error("Erro HTTP: " + resposta.status);
                }

                const clientes = await resposta.json();

                const lista = document.getElementById("listaClientes");
                lista.innerHTML = "";

                clientes.forEach(cliente => {
                    const linha = document.createElement("tr");

                    const adicionarCelula = (valor) => {
                        const celula = document.createElement("td");
                        celula.textContent = valor ?? "";
                        linha.appendChild(celula);
                    };

                    adicionarCelula(cliente.idCliente);
                    adicionarCelula(cliente.nome);
                    adicionarCelula(cliente.cpf);
                    adicionarCelula(cliente.endereco);
                    adicionarCelula(cliente.telefone);
                    adicionarCelula(cliente.email);

                    const celulaAcao = document.createElement("td");
                    const botao = document.createElement("button");

                    botao.textContent = "Alterar";
                    botao.type = "button";

                    botao.addEventListener("click", async () => {
                        document.getElementById("cpf").value = cliente.cpf;
                        await buscarCliente();

                        document.getElementById("formCliente")
                            .scrollIntoView({ behavior: "smooth" });
                    });

                    celulaAcao.appendChild(botao);
                    linha.appendChild(celulaAcao);

                    lista.appendChild(linha);
                });

            } catch (erro) {
                console.error("Erro ao carregar clientes:", erro);
                alert("Não foi possível carregar a lista de clientes.");
            }
        }
        document.getElementById("formCliente").addEventListener("submit", async function (event) {
            event.preventDefault();

            try {
                const resposta = await fetch("/clientes/salvar", {
                    method: "POST",
                    body: new FormData(this)
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    alert(resultado.erro);
                    return;
                }

                alert(resultado.mensagem +
                    "\nCódigo do cliente: " + resultado.idCliente);

                this.reset();
                document.getElementById("idCliente").value = "";

                await carregarClientes();

            } catch (erro) {
                alert("Erro ao salvar cliente.");
                console.error(erro);
            }
        });
        carregarClientes();
    </script>

</body>

</html>
