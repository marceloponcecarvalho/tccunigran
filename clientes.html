<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
</head>

<body>

    <header>
        <h1>Manutenção de Piscinas</h1>
    </header>

    <main>
        <h2>Cadastro de Clientes</h2>

        <form id="formCliente" action="/clientes/cadastrar" method="POST">

            <input type="hidden" name="idCliente" id="idCliente">

            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
            </div>

            <div class="campo">
                <label>Endereço:</label>
                <input type="text" name="endereco" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="botoes">
                <a href="index.html" class="voltar">Voltar</a>
                <button type="submit">Cadastrar</button>
            </div>

        </form>

        <h2>Clientes cadastrados</h2>

        <table border="1" cellpadding="8" cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Endereço</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="listaClientes">
            </tbody>
        </table>




    </main>
    <script>
        const form = document.getElementById("formCliente");
        const lista = document.getElementById("listaClientes");

        // Consulta os clientes cadastrados
        async function carregarClientes() {
            const resposta = await fetch("/clientes/listar");
            const clientes = await resposta.json();

            lista.innerHTML = "";

            clientes.forEach(cliente => {
                const linha = document.createElement("tr");

                const dados = [
                    cliente.idCliente,
                    cliente.nome,
                    cliente.cpf,
                    cliente.endereco,
                    cliente.telefone,
                    cliente.email
                ];

                dados.forEach(valor => {
                    const coluna = document.createElement("td");
                    coluna.textContent = valor ?? "";
                    linha.appendChild(coluna);
                });

                const colunaAcao = document.createElement("td");
                const botao = document.createElement("button");

                botao.textContent = "Alterar";
                botao.type = "button";

                botao.addEventListener("click", () => editarCliente(cliente));

                colunaAcao.appendChild(botao);
                linha.appendChild(colunaAcao);

                lista.appendChild(linha);
            });
        }

        // Carrega os dados selecionados no formulário
        function editarCliente(cliente) {
            form.elements.namedItem("idCliente").value = cliente.idCliente;
            form.elements.namedItem("nome").value = cliente.nome;
            form.elements.namedItem("cpf").value = cliente.cpf;
            form.elements.namedItem("endereco").value = cliente.endereco ?? "";
            form.elements.namedItem("telefone").value = cliente.telefone ?? "";
            form.elements.namedItem("email").value = cliente.email ?? "";

            form.action = "/clientes/alterar";

            form.querySelector("button[type='submit']").textContent = "Salvar alterações";

            window.scrollTo(0, 0);
        }

        // Carrega a lista ao abrir a página
        carregarClientes();
    </script>

</body>

</html>
