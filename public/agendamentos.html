
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Manutenções</title>
</head>

<body>

    <header>
        <h1>Manutenção de Piscinas - Agenda de Manutenções</h1>
    </header>

    <main>
        <form id="formAgendamento">

            <h3>Dados do Agendamento</h3>

            <input type="hidden" name="idAgendamento" id="idAgendamento">

            <div class="campo">
                <label for="idCliente">Cliente:</label>
                <select id="idCliente" name="idCliente" required>
                    <option value="">Selecione um cliente</option>
                </select>
            </div>

            <div class="campo">
                <label for="data">Data:</label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="campo">
                <label for="horario">Horário:</label>
                <select id="horario" name="horario" required>
                    <option value="">Selecione um horário</option>
                    <option value="05:00">05:00</option>
                    <option value="08:00">08:00</option>
                    <option value="11:00">11:00</option>
                    <option value="14:00">14:00</option>
                    <option value="17:00">17:00</option>
                </select>
            </div>

            <div id="mensagem"></div>

            <div class="botoes">
                <button type="button" class="voltar"
                    onclick="window.location.href='index.html'">
                    Voltar
                </button>

                <button type="button" id="btnLimpar">
                    Limpar
                </button>

                <button type="submit">
                    Salvar
                </button>
            </div>

        </form>

        <h2>Agendamentos cadastrados</h2>

        <table border="1" cellpadding="8" cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Cliente</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="listaAgendamentos">
            </tbody>
        </table>

    </main>

    <script src="/js/agendamentos.js" defer></script>

</body>

</html>
