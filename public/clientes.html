<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
</head>

<body>

    <header>
        <h1>Manutenção de Piscinas - Cadastro de Clientes</h1>
    </header>

    <main>
        <form id="formCliente" action="/clientes/salvar" method="POST">

            <h3>Dados do Cliente</h3>

            <input type="hidden" name="idCliente" id="idCliente">

            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label>CPF/CNPJ:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="18" required>
                <button type="button" onclick="buscarCliente()">Consultar</button>
            </div>

            <div class="campo">
                <label>Endereço:</label>
                <input type="text" name="endereco" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </div>


            <h3>Dimensões da piscina</h3>

            <label>Profundidade (metros):</label>
            <input type="number" name="profundidade" step="0.01" min="0.01" required>

            <label>Tamanho do lado 1 (metros):</label>
            <input type="number" name="lado1" step="0.01" min="0.01" required>

            <label>Tamanho do lado 2 (metros):</label>
            <input type="number" name="lado2" step="0.01" min="0.01" required>

            <div class="botoes">
                <button type="button" class="voltar" onclick="window.location.href='index.html'">
                    Voltar
                </button>

                <button type="button" onclick="limparFormulario()">
                    Limpar
                </button>

                <button type="submit">Salvar</button>
            </div>

        </form>

        <h2>Clientes cadastrados</h2>

        <table border="1" cellpadding="8" cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Endereço</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Volume Piscina (m³)</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="listaClientes">
            </tbody>
        </table>




    </main>
    <script src="/js/clientes.js" defer></script>

</body>

</html>
